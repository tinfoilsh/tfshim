name: goreleaser

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger config repo updates
        run: |
          # Download the checksums file that goreleaser just created
          gh release download "${{ github.ref_name }}" --pattern "tfshim_checksums.txt"
          SHA=$(grep "tfshim$" tfshim_checksums.txt | awk '{print $1}')

          # Trigger the update workflow
          gh workflow run update-config-repos.yml \
            --field version="${{ github.ref_name }}" \
            --field sha="$SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
